<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Customers</title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- Bootstrap Icons -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <!-- Application CSS -->

    <link
        rel="stylesheet"
        href="../css/style.css">

</head>


<body>


<!-- ============================================================
     APPLICATION LAYOUT
     ============================================================ -->

<div id="appLayout"></div>



<!-- ============================================================
     CUSTOMER MODAL
     ============================================================ -->

<div
    class="modal fade"
    id="customerModal"
    tabindex="-1"
    aria-hidden="true">

    <div
        class="modal-dialog
               modal-lg
               modal-dialog-centered">

        <div class="modal-content">


            <!-- HEADER -->

            <div class="modal-header">

                <h5
                    class="modal-title"
                    id="customerModalTitle">

                    Add Customer

                </h5>


                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal">
                </button>

            </div>



            <!-- FORM -->

            <form id="customerForm">

                <div class="modal-body">


                    <!-- ALERT -->

                    <div
                        id="customerFormAlert"
                        class="alert d-none">
                    </div>



                    <div class="row">


                        <!-- FIRST NAME -->

                        <div class="col-md-6 mb-3">

                            <label
                                for="firstName"
                                class="form-label">

                                First Name

                            </label>


                            <input
                                type="text"
                                id="firstName"
                                class="form-control"
                                maxlength="100"
                                required>

                        </div>



                        <!-- LAST NAME -->

                        <div class="col-md-6 mb-3">

                            <label
                                for="lastName"
                                class="form-label">

                                Last Name

                            </label>


                            <input
                                type="text"
                                id="lastName"
                                class="form-control"
                                maxlength="100"
                                required>

                        </div>

                    </div>



                    <div class="row">


                        <!-- PHONE -->

                        <div class="col-md-6 mb-3">

                            <label
                                for="phone"
                                class="form-label">

                                Phone

                            </label>


                            <input
                                type="text"
                                id="phone"
                                class="form-control"
                                maxlength="30"
                                placeholder="+243...">

                        </div>



                        <!-- EMAIL -->

                        <div class="col-md-6 mb-3">

                            <label
                                for="email"
                                class="form-label">

                                Email

                            </label>


                            <input
                                type="email"
                                id="email"
                                class="form-control"
                                maxlength="150">

                        </div>

                    </div>



                    <!-- ADDRESS -->

                    <div class="mb-3">

                        <label
                            for="address"
                            class="form-label">

                            Address

                        </label>


                        <textarea
                            id="address"
                            class="form-control"
                            rows="3"
                            maxlength="255">
                        </textarea>

                    </div>

                </div>



                <!-- FOOTER -->

                <div class="modal-footer">

                    <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">

                        Cancel

                    </button>


                    <button
                        type="submit"
                        id="saveCustomerButton"
                        class="btn btn-primary">

                        Save Customer

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>



<!-- ============================================================
     BOOTSTRAP JS
     ============================================================ -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>



<!-- ============================================================
     APPLICATION JS
     ============================================================ -->

<script src="../js/config.js"></script>

<script src="../js/session.js"></script>

<script src="../js/api.js"></script>

<script src="../js/layout.js"></script>

<script src="../js/customers.js"></script>


</body>

</html>
