<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Products</title>


    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


    <!-- Application CSS -->

    <link rel="stylesheet" href="../css/style.css">

</head>


<body>


    <!-- ============================================================
     APPLICATION LAYOUT
     ============================================================ -->

    <div id="appLayout"></div>



    <!-- ============================================================
     PRODUCT MODAL
     ============================================================ -->

    <div class="modal fade" id="productModal" tabindex="-1" aria-hidden="true">

        <div class="modal-dialog modal-lg modal-dialog-centered">

            <div class="modal-content">


                <!-- HEADER -->

                <div class="modal-header">

                    <h5 class="modal-title" id="productModalTitle">

                        Add Product

                    </h5>

                    <button type="button" class="btn-close" data-bs-dismiss="modal">
                    </button>

                </div>


                <!-- FORM -->

                <form id="productForm">

                    <div class="modal-body">


                        <!-- ALERT -->

                        <div id="productFormAlert" class="alert d-none">
                        </div>


                        <!-- PRODUCT NAME -->

                        <div class="mb-3">

                            <label for="productName" class="form-label">

                                Product Name

                            </label>

                            <input type="text" id="productName" class="form-control" maxlength="150" required>

                        </div>



                        <div class="row">


                            <!-- CATEGORY -->

                            <div class="col-md-6 mb-3">

                                <label for="productCategory" class="form-label">

                                    Category

                                </label>

                                <select id="productCategory" class="form-select" required>

                                    <option value="">
                                        Select category
                                    </option>

                                </select>

                            </div>


                            <!-- UNIT -->

                            <div class="col-md-6 mb-3">

                                <label for="unit" class="form-label">

                                    Unit

                                </label>

                                <input type="text" id="unit" class="form-control" maxlength="30"
                                    placeholder="piece, kg, litre..." required>

                            </div>

                        </div>



                        <div class="row">


                            <!-- PURCHASE PRICE -->

                            <div class="col-md-6 mb-3">

                                <label for="purchasePrice" class="form-label">

                                    Purchase Price

                                </label>

                                <input type="number" id="purchasePrice" class="form-control" min="0" step="0.01"
                                    required>

                            </div>


                            <!-- SELLING PRICE -->

                            <div class="col-md-6 mb-3">

                                <label for="sellingPrice" class="form-label">

                                    Selling Price

                                </label>

                                <input type="number" id="sellingPrice" class="form-control" min="0" step="0.01"
                                    required>

                            </div>

                        </div>



                        <div class="row">


                            <!-- STOCK -->

                            <div class="col-md-6 mb-3">

                                <label for="stock" class="form-label">

                                    Stock

                                </label>

                                <input type="number" id="stock" class="form-control" min="0" step="0.01" required>

                            </div>


                            <!-- ALERT STOCK -->

                            <div class="col-md-6 mb-3">

                                <label for="alertStock" class="form-label">

                                    Alert Stock

                                </label>

                                <input type="number" id="alertStock" class="form-control" min="0" step="0.01" value="5"
                                    required>

                            </div>

                        </div>


                    </div>


                    <!-- FOOTER -->

                    <div class="modal-footer">

                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">

                            Cancel

                        </button>


                        <button type="submit" id="saveProductButton" class="btn btn-primary">

                            Save Product

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>



    <!-- ============================================================
     DELETE MODAL
     ============================================================ -->

    <div class="modal fade" id="deleteProductModal" tabindex="-1" aria-hidden="true">

        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content">


                <div class="modal-header">

                    <h5 class="modal-title">

                        Delete Product

                    </h5>

                    <button type="button" class="btn-close" data-bs-dismiss="modal">
                    </button>

                </div>


                <div class="modal-body">

                    <div id="deleteProductAlert" class="alert d-none">
                    </div>

                    <p class="mb-0">

                        Are you sure you want to delete

                        <strong id="deleteProductName"></strong>?

                    </p>

                </div>


                <div class="modal-footer">

                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">

                        Cancel

                    </button>


                    <button type="button" id="confirmDeleteButton" class="btn btn-danger">

                        Delete

                    </button>

                </div>

            </div>

        </div>

    </div>



    <!-- Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


    <!-- Application JS -->

    <script src="../js/session.js"></script>

    <script src="../js/api.js"></script>

    <script src="../js/layout.js"></script>

    <script src="../js/products.js"></script>


</body>

</html>
