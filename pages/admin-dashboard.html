<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

    <div id="appLayout"></div>

    <script src="../js/config.js"></script>
    <script src="../js/session.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/layout.js"></script>

    <script>

        if (Session.requireRole("ADMIN")) {

            renderLayout();

            document
                .getElementById("pageContent")
                .innerHTML = `

                <h2 class="fw-bold">
                    Admin Dashboard
                </h2>

                <p class="text-muted">
                    Manage the application from here.
                </p>

                <div class="row g-4 mt-2">

                    <div class="col-md-4">

                        <div class="card shadow-sm border-0">

                            <div class="card-body">

                                <h5>
                                    Users
                                </h5>

                                <p class="text-muted">
                                    Manage application users.
                                </p>

                                <a
                                    href="users.html"
                                    class="btn btn-primary">

                                    Manage Users

                                </a>

                            </div>

                        </div>

                    </div>

                    <div class="col-md-4">

                        <div class="card shadow-sm border-0">

                            <div class="card-body">

                                <h5>
                                    Reports
                                </h5>

                                <p class="text-muted">
                                    Application reports.
                                </p>

                            </div>

                        </div>

                    </div>

                    <div class="col-md-4">

                        <div class="card shadow-sm border-0">

                            <div class="card-body">

                                <h5>
                                    Settings
                                </h5>

                                <p class="text-muted">
                                    System configuration.
                                </p>

                            </div>

                        </div>

                    </div>

                </div>
            `;
        }

    </script>

</body>

</html>
