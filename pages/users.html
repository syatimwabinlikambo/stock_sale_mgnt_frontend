<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

    <div id="appLayout"></div>


    <!-- ================================
     ADD USER MODAL
     ================================= -->

    <div class="modal fade" id="addUserModal" tabindex="-1">

        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content">

                <div class="modal-header">

                    <h5 class="modal-title">
                        Create User
                    </h5>

                    <button type="button" class="btn-close" data-bs-dismiss="modal">
                    </button>

                </div>


                <div class="modal-body">

                    <div id="userFormAlert" class="alert d-none">
                    </div>


                    <form id="userForm">

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    First Name
                                </label>

                                <input type="text" id="firstName" class="form-control" required>

                            </div>


                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Last Name
                                </label>

                                <input type="text" id="lastName" class="form-control" required>

                            </div>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Email
                            </label>

                            <input type="email" id="email" class="form-control" required>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Password
                            </label>

                            <input type="password" id="password" class="form-control" minlength="8" required>

                        </div>

                        <div class="mb-3">

                            <label for="role" class="form-label">

                                Role

                            </label>

                            <select id="role" class="form-select" required>

                                <option value="">
                                    Select role
                                </option>

                            </select>

                        </div>
                        <!-- 
                        <div class="mb-3">

                            <label class="form-label">
                                Role
                            </label>

                            <select id="role" class="form-select" required>

                                <option value="">
                                    Select role
                                </option>

                                <option value="USER">
                                    User
                                </option>

                                <option value="MANAGER">
                                    Manager
                                </option>

                                <option value="ADMIN">
                                    Administrator
                                </option>

                            </select>

                        </div> -->

                    </form>

                </div>


                <div class="modal-footer">

                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">

                        Cancel

                    </button>

                    <button type="submit" form="userForm" id="saveUserButton" class="btn btn-primary">

                        Create User

                    </button>

                </div>

            </div>

        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="../js/config.js"></script>
    <script src="../js/session.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/users.js"></script>


    <script>

        if (Session.requireRole("ADMIN")) {

            renderLayout();

            loadUsers();

        }

    </script>

</body>

</html>
